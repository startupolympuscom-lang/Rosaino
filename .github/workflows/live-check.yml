# One-off check of the live deployment (database, sign-in, routes). Removed after use.
name: live-check
on:
  push:
    branches: [claude/fervent-lamport-x3bf0g]
    paths: ['.github/workflows/live-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase project lookup
        run: |
          REF=kwqbghlwarkibhlgbgft
          for h in $REF.supabase.co db.$REF.supabase.co; do
            echo "== DNS $h"; echo "A:    $(dig +short A $h | tr '\n' ' ')"; echo "AAAA: $(dig +short AAAA $h | tr '\n' ' ')"; echo "CNAME: $(dig +short CNAME $h | tr '\n' ' ')"
          done
          echo "== Supabase API for this project"; curl -s -m 20 -o /dev/null -w '[HTTP %{http_code}]\n' https://$REF.supabase.co/rest/v1/ || echo "no answer"
          echo "== Supabase status page"; curl -s -m 20 https://status.supabase.com/api/v2/status.json | head -c 300; echo
          echo "== pooler hosts resolve (region check needs the password, not done here)"
          for r in eu-west-1 eu-west-2 eu-west-3 eu-central-1 eu-central-2 eu-north-1 us-east-1 us-east-2 us-west-1 us-west-2 ap-south-1 ap-southeast-1 ap-southeast-2 ap-northeast-1 ap-northeast-2 sa-east-1 ca-central-1; do
            for n in 0 1; do h=aws-$n-$r.pooler.supabase.com; a=$(dig +short A $h | head -1); [ -n "$a" ] && echo "$h -> $a"; done
          done
