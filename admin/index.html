<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Rosaino Operations & ERP Portal</title>
  <link rel="icon" href="/assets/icon.png">
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <!-- Simple Auth Login Overlay (shown if not logged in) -->
  <div id="login-screen" style="display: none;">
    <div class="login-card">
      <div class="login-header">
        <a href="/" title="Back to storefront"><img src="/assets/logo.png" alt="Rosaino"></a>
        <h1>Operations Portal</h1>
        <p>Sign in with your administrator account to access the workspace.</p>
      </div>

      <div id="login-error-msg" class="login-error"></div>

      <form id="admin-login-form" class="login-form">
        <div class="login-field">
          <label for="login-email">Email Address</label>
          <input id="login-email" type="email" name="email" required autocomplete="email" placeholder="you@rosaino.com">
        </div>

        <div class="login-field">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" name="password" required autocomplete="current-password" placeholder="Enter password">
        </div>

        <button type="submit" class="primary" style="margin-top: 10px; justify-content: center; width: 100%;">
          Sign In
        </button>
      </form>

      <div class="login-footer" style="display:flex;justify-content:center;margin-top:16px;">
        <a href="/" target="_self" style="color:#64748b;font-size:12.5px;text-decoration:none;">← Return to Storefront</a>
      </div>
    </div>
  </div>

  <!-- Authenticated Workspace Sidebar -->
  <aside id="sidebar">
    <a class="logo" href="/" target="_self"><img src="/assets/logo.png" alt="Rosaino"></a>
    <div class="workspace">OPERATIONS WORKSPACE <span>ERP/CMS</span></div>
    <nav id="nav" aria-label="Operations"></nav>
    <a class="back" href="/" target="_self">Back to storefront ↗</a>
    <div class="profile" id="user-profile-badge">
      <b id="profile-avatar">SA</b>
      <div style="flex:1;">
        <strong id="sidebar-user-name">Administrator</strong>
        <small id="sidebar-user-role">Super Admin</small>
        <button type="button" id="sidebar-logout-btn" class="btn-logout" title="Sign out">Sign out</button>
      </div>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main>
    <header>
      <button id="menu" aria-label="Toggle navigation">☰</button>
      <div><span class="muted">Workspace /</span> <span id="breadcrumb">Overview</span></div>
      <div class="header-right">
        <!-- Quick Storefront Link -->
        <a href="/" target="_self" style="display:inline-flex;align-items:center;gap:4px;padding:6px 12px;background:#f0f8f7;border:1px solid #c2dbd7;border-radius:6px;color:#147d86;font-size:12px;font-weight:600;text-decoration:none;" title="Open customer storefront">
          Storefront ↗
        </a>

        <!-- Language Switcher -->
        <div class="lang-selector-wrap" id="lang-selector-wrap">
          <button type="button" class="lang-dropdown-btn" id="lang-dropdown-btn" title="Change Language (FR / EN / AR)" aria-haspopup="true">
            <span id="current-lang-code" style="font-size:11.5px;font-weight:700;">FR</span>
            <span id="current-lang-label">Français</span>
            <span class="chevron" style="font-size:10px;">▾</span>
          </button>
          <div class="lang-dropdown-menu" id="lang-dropdown-menu">
            <button type="button" class="lang-option" data-lang="fr">
              <span class="tag">FR</span> <span class="name">Français</span>
            </button>
            <button type="button" class="lang-option" data-lang="en">
              <span class="tag">EN</span> <span class="name">English</span>
            </button>
            <button type="button" class="lang-option" data-lang="ar">
              <span class="tag">AR</span> <span class="name">العربية</span>
            </button>
          </div>
        </div>

        <div class="supabase-pill" id="supabase-status-pill" title="Database Connection Status">
          <span class="dot"></span> <span id="supabase-pill-text">Database Connected</span>
        </div>
        <span id="header-user-tag"><strong id="header-role-name">Administrator</strong></span>
        <button id="header-logout-btn" style="color:#ac3838;font-size:12px;background:none;border:none;cursor:pointer;padding:4px 8px;">Sign out</button>
      </div>
    </header>

    <section id="content"></section>
  </main>

  <dialog id="modal"><div id="modal-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="demo.js"></script>
</body>
</html>
